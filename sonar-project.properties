sonar.exclusions=node_modules/**,dist/**,frontend/**,coverage/**,main.js,style.css,*.config.{js,ts}

sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=spora-ai/spora-plugin-team-graph-frontend

sonar.cpd.exclusions=src/**/*.{vue,ts}