sonar.organization=spora-ai
sonar.projectKey=spora-ai_spora-plugin-team-graph-frontend
sonar.projectName=spora-plugin-team-graph-frontend
sonar.projectVersion=0.1.0

sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.test.inclusions=tests/**/*.{test,spec}.{js,ts}

